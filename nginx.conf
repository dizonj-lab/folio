# Static LikeC4 sites. Each model is built with hash history, so every request is a real file.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options SAMEORIGIN always;

    location = /healthz { access_log off; try_files /healthz =404; }

    # Hashed build assets never change; everything else is checked on each visit.
    # Demo video and subtitles. Readable from other origins: CEREBRO's landing page plays the video
    # and loads its subtitles from here. Headers are repeated because add_header here replaces the
    # server-level ones.
    location /media/ {
        types { video/mp4 mp4; text/vtt vtt; }
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        try_files $uri =404;
    }

    # Feedback hub. Resolved on each request, so the site still serves when the hub is down.
    location /api/feedback/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $hub http://feedback:8000;
        proxy_pass $hub;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 16k;
        proxy_read_timeout 15s;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
    }

    # NEXUS landing page: its demo video and captions.
    location /nexus/media/ {
        types { video/mp4 mp4; text/vtt vtt; image/jpeg jpg; }
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        try_files $uri =404;
    }

    location ~* /assets/ { expires 30d; add_header Cache-Control "public, immutable"; try_files $uri =404; }
    location / { add_header Cache-Control "no-cache"; try_files $uri $uri/ $uri/index.html =404; }
}
