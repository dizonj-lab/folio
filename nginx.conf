# Static LikeC4 sites. Each model is built with hash history, so every request is a real file.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options SAMEORIGIN always;

    location = /healthz { access_log off; try_files /healthz =404; }

    # Hashed build assets never change; everything else is checked on each visit.
    location ~* /assets/ { expires 30d; add_header Cache-Control "public, immutable"; try_files $uri =404; }
    location / { add_header Cache-Control "no-cache"; try_files $uri $uri/ $uri/index.html =404; }
}
