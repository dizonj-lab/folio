# The portfolio on the home server: profile, projects, the MealSenseAI data-and-ML page, and the
# LikeC4 architecture models of MealSenseAI and CEREBRO, built to a static site and served by nginx.
# Run ./setup.sh rather than this file directly.
#
#   /                 portfolio (content: portfolio.json, pages/)
#   /mealsenseai/     MealSenseAI model (from MEALSENSE_DIR)
#   /cerebro/         CEREBRO model (from CEREBRO_DIR)
#
# Public at https://folio.xtangent.ai through the Cloudflare Tunnel, whose cloudflared runs on this
# machine and reaches http://127.0.0.1:8095. Docker bypasses UFW for published ports, so the port is
# bound to loopback (ARCH_BIND), never 0.0.0.0, and no router port is forwarded.
#
# Its own Compose project: it shares no network, container or volume with MealSenseAI or CEREBRO.
name: folio

x-hardening: &hardening
  security_opt: ["no-new-privileges:true"]
  pids_limit: 256
  logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }

services:
  # One-off: `docker compose --profile build run --rm build`. Needs internet for npm.
  build:
    <<: *hardening
    image: node:22-alpine
    profiles: [build]
    working_dir: /work
    environment:
      LIKEC4_VERSION: ${LIKEC4_VERSION:-1.60.0}
    volumes:
      - ./build.sh:/work/build.sh:ro
      - ./index.template.html:/work/index.template.html:ro
      - ./page.template.html:/work/page.template.html:ro
      - ./site.css:/work/site.css:ro
      - ./charts.js:/work/charts.js:ro
      - ./pages:/work/pages:ro
      - ./render.mjs:/work/render.mjs:ro
      - ./portfolio.json:/work/portfolio.json:ro
      - ./brand:/work/brand:ro
      - ${MEALSENSE_MODEL:-./empty}:/models/mealsenseai:ro
      - ${CEREBRO_MODEL:-./empty}:/models/cerebro:ro
      - site:/site
      - npm-cache:/root/.npm
    command: ["sh", "/work/build.sh"]

  web:
    <<: *hardening
    image: nginx:1.27-alpine
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, NET_BIND_SERVICE]
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run, /tmp]
    ports: ["${ARCH_BIND:-127.0.0.1}:${ARCH_PORT:-8095}:80"]
    volumes:
      - site:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    mem_limit: 128m

volumes:
  site: {}
  npm-cache: {}
